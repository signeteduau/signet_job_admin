# Hestia custom Nginx config for Signet Admin Panel (Vite React SPA)
#
# Replace WEBROOT with your public_html path, e.g.:
#   /home/user/web/admin.signetemploymenthub.com/public_html
#
# Install on server:
#   /home/user/conf/web/admin.signetemploymenthub.com/nginx.ssl.conf_custom
#   /home/user/conf/web/admin.signetemploymenthub.com/nginx.conf_custom
#
# Hestia SSL proxy has no document root — root MUST be set for try_files.
# Then: nginx -t && systemctl reload nginx

location ^~ /login {
    root WEBROOT;
    try_files /index.html =404;
}

location ^~ /admin {
    root WEBROOT;
    try_files $uri $uri/ /index.html;
}
