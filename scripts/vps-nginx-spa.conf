# Hestia custom Nginx config for Signet Admin Panel (Vite React SPA)
#
# Install on server:
#   /home/user/conf/web/admin.signetemploymenthub.com/nginx.ssl.conf_custom
#   /home/user/conf/web/admin.signetemploymenthub.com/nginx.conf_custom
#
# Do NOT add a second `location /` — Hestia templates already define one.
# Use error_page fallback for client-side routes instead.
#
# Then rebuild:
#   v-rebuild-web-domain user admin.signetemploymenthub.com

error_page 404 =200 /index.html;
