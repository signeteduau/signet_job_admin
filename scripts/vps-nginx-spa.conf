# Hestia custom Nginx config for Signet Admin Panel (Vite React SPA)
#
# Install on server:
#   /home/user/conf/web/admin.signemploymenthub.com/nginx.ssl.conf_custom
#   /home/user/conf/web/admin.signemploymenthub.com/nginx.conf_custom
#
# Then rebuild:
#   v-rebuild-web-domain user admin.signemploymenthub.com

location / {
    try_files $uri $uri/ /index.html;
}

location ~* \.(?:js|css|png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}
